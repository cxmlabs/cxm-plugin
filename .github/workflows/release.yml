# Publishing a version on one tag, two channels:
#  - marketplace: fast-forward the `release` branch users track + cut a GitHub Release
#    (both agents install the plugin straight from git, no registry upload for that).
#  - npm: publish the `cxm` CLI so `npx @cloudexmachina/cxm …` works without repo access.
# The npm step runs only when the repo variable NPM_PUBLISH is 'true', so the marketplace
# release never depends on npm being configured.
name: release

on:
  push:
    tags: ['v*']
  # tag-release starts it on the tag: a tag pushed with GITHUB_TOKEN triggers nothing.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # The npm trusted publisher is bound to this environment, which only v* tags may deploy to.
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Runs on a version tag
        run: '[[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "run release.yml on a v* tag, not $GITHUB_REF"; exit 1; }'

      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $GITHUB_REF_NAME != package.json $pkg"; exit 1; }

      - name: Manifests carry the same version
        run: node scripts/sync-version.mjs --check

      - name: Manifests are valid JSON with the expected shape
        run: node scripts/validate-manifests.mjs

      - run: node --test
        env:
          CXM_TELEMETRY: '0' # test runs must not reach usage analytics

      - name: Fast-forward the release branch
        run: |
          git push origin "$GITHUB_SHA:refs/heads/release"

      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "cxm-agent-plugin $GITHUB_REF_NAME"

      # Second channel: the npm CLI, through trusted publishing (OIDC) with no stored token. The
      # trusted publisher allows staging only: the version goes live once an npm org owner approves
      # it with 2FA (npmjs.com, or `npm stage approve <id>`). Staged publishing needs npm 11.15.0+.
      - name: Stage the CLI on npm
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: |
          npm install -g npm@latest
          npm stage publish --provenance
